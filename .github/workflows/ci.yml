name: trusted-verification-gate

# R3-GATE0 — the authoritative remote verification gate.
# Local stdout / npm exit codes / `gh pr merge` output are NOT trusted; the truth is this workflow's
# conclusion + the structured artifact it uploads, both bound to a concrete commit SHA.
# This workflow is read-only: it never commits, pushes, tags, releases, or mutates the repo.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the checkout, nothing else. No write scopes anywhere.
permissions:
  contents: read

concurrency:
  group: trusted-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: trusted-verification
    runs-on: ubuntu-latest
    # Job ceiling exceeds the SUM of EVERY step timeout below (checkout 5 + setup 5 + verifiers ≈33 ≈ 43),
    # so even if every step ran to its own limit the job would not be killed before evidence collection +
    # upload. A single hung step is killed at the step (a failure, NOT a cancel), and collect + upload run.
    timeout-minutes: 50
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      TEST_TIMEOUT_MS: '180000'
    steps:
      # Pin every third-party Action to a full commit SHA (never a moving tag).
      - name: Checkout (PR HEAD commit, not the synthetic merge ref)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node 22 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        timeout-minutes: 5
        with:
          node-version: '22'

      - name: Resolve base/head identity (pass GitHub context via env, never inline)
        timeout-minutes: 2
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=0 origin main >/dev/null 2>&1 || git fetch --no-tags origin main >/dev/null 2>&1 || true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"; HEAD="$GH_SHA"
          else
            BASE="$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            HEAD="$(git rev-parse HEAD)"
          fi
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD)";; esac
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD" >> "$GITHUB_ENV"
          echo "resolved event=$EVENT_NAME BASE_SHA=$BASE HEAD_SHA=$HEAD"

      - name: Verify checked-out SHA matches the event-reported SHA
        timeout-minutes: 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "checked-out=$ACTUAL  expected HEAD_SHA=$HEAD_SHA  github.sha=$GH_SHA"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            if [ "$ACTUAL" != "$HEAD_SHA" ]; then
              echo "::error::checked-out SHA ($ACTUAL) != expected HEAD_SHA ($HEAD_SHA)"; exit 1
            fi
          fi

      # Dependency-free lane: this repo has never tracked a lockfile and verification needs no third-party
      # package (deps={} ; tests/scripts use only Node builtins + relative requires). The job therefore
      # installs nothing; the dependency audit below proves that contract. (Electron packaging is a
      # separate future milestone, not this gate.)
      - name: Confirm dependency-free lane (this job installs nothing)
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "Dependency-free verification lane: only node scripts run here."
          echo "node version: $(node -v)"
          echo "npm version: $(npm -v)"

      - name: A0 — Dependency audit (self-test, then prove no third-party packages reachable)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          node scripts/check-verification-dependencies.js --selftest
          node scripts/check-verification-dependencies.js

      - name: A — Full per-file test manifest
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/run-tests-manifest.js

      - name: B — i18n three-language parity
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/check-i18n.js

      - name: C — Feature registry / reachability
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/check-feature-registry.js

      - name: D — Vehicle preset integrity
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/check-preset-integrity.js

      - name: E — Frozen-boundary guard
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        # R3.0C C8_ACTIVATION authorizes renderer/js/feature-registry.js to flip the three R3.0C
        # feature IDs from deferred to active. The frozen-boundary mechanism uses FROZEN_ALLOW for
        # exactly this milestone-authorized change. While featureRegistryActivationAllowed=false
        # (C0–C7) the file is treated as fully frozen; once C8 flips the flag the allowlist is
        # populated for this single file only — any OTHER frozen file touched still fails the check.
        run: |
          ALLOW=""
          if node -e "const s=require('./governance/r3.0c/state.json');process.exit(s.featureRegistryActivationAllowed===true&&(s.authorizedProductionPaths||[]).some(e=>e&&e.path==='renderer/js/feature-registry.js'&&e.capability==='feature_registry_active')?0:1)"; then
            ALLOW="renderer/js/feature-registry.js"
          fi
          FROZEN_ALLOW="$ALLOW" node scripts/check-frozen-boundary.js

      - name: F — Package version policy
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/check-version-policy.js

      - name: F2 — Supply-chain governance (lockfile/SBOM/vendor/licenses; dependency-free static)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        # Reads package-lock.json + vendored files + SBOM statically (Node builtins only); needs no
        # package manager to run, so it belongs in the dependency-free lane. The clean-install
        # reproducibility proof lives in the separate supply-chain-build workflow.
        run: |
          node scripts/check-supply-chain.js --selftest
          node scripts/check-supply-chain.js

      - name: G — R3.0C scope guard
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/check-r3-0c-guard.js

      # R3.0C C0 — Integrated Delivery Governance.
      # The three checks below are UNCONDITIONAL: they run on every PR and every push to main, never
      # short-circuited by "this PR did not touch R3.0C" — governance truth must be validated continuously.
      - name: H — R3.0C governance state
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/check-r3-0c-governance.js

      - name: I — R3.0C no-runtime-consumer
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/check-r3-0c-no-consumer.js

      - name: J — R3.0C governance integrity (visibility)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/check-r3-0c-governance-integrity.js

      # R3.0 G1 — Integrated Delivery Train per-phase governance (D / E / F) + train-level validator.
      # All steps below are UNCONDITIONAL: they run on every PR and every push to main, never short-circuited
      # by "this PR did not touch R3.0D/E/F" — governance truth must be validated continuously across the
      # entire R3.0 Integrated Delivery Train scope, not only when a particular phase's files change.
      - name: K — R3.0D governance state
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          R3_PHASE_PROGRAM: R3.0D
        run: node scripts/check-r3-phase-governance.js

      - name: K2 — R3.0D no-runtime-consumer
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          R3_PHASE_PROGRAM: R3.0D
        run: node scripts/check-r3-phase-no-consumer.js

      - name: K3 — R3.0D governance integrity (visibility)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          R3_PHASE_PROGRAM: R3.0D
        run: node scripts/check-r3-phase-governance-integrity.js

      - name: L — R3.0E governance state
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          R3_PHASE_PROGRAM: R3.0E
        run: node scripts/check-r3-phase-governance.js

      - name: L2 — R3.0E no-runtime-consumer
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          R3_PHASE_PROGRAM: R3.0E
        run: node scripts/check-r3-phase-no-consumer.js

      - name: L3 — R3.0E governance integrity (visibility)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          R3_PHASE_PROGRAM: R3.0E
        run: node scripts/check-r3-phase-governance-integrity.js

      - name: M — R3.0F governance state
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          R3_PHASE_PROGRAM: R3.0F
        run: node scripts/check-r3-phase-governance.js

      - name: M2 — R3.0F no-runtime-consumer
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          R3_PHASE_PROGRAM: R3.0F
        run: node scripts/check-r3-phase-no-consumer.js

      - name: M3 — R3.0F governance integrity (visibility)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          R3_PHASE_PROGRAM: R3.0F
        run: node scripts/check-r3-phase-governance-integrity.js

      - name: N — R3.0 Integrated Delivery Train (cross-phase + scope pin + historical lineage)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: node scripts/check-r3-0-train.js

      - name: Collect evidence + summary (final gate)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node scripts/collect-evidence.js

      - name: Upload trusted-verification-evidence
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-verification-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
