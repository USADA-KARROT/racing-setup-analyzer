# Deploy the hosted Web Preview (static web-dist) to GitHub Pages.
#
# Browser-first delivery: the Pages site IS the primary distribution channel;
# the DMG is an experimental desktop build. The bundle is produced by
# scripts/build-web-dist.js, whose fail-closed self-audit guarantees the site
# can never contain Electron internals (main/preload), node_modules, tests,
# governance evidence, deferred modules, or build artifacts.
#
# No secrets required; deploys only from main (or a manual dispatch).
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node 22 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Build static Web Preview bundle (self-auditing, fail-closed)
        run: node scripts/build-web-dist.js

      - name: Independent content audit of web-dist (belt-and-braces)
        run: |
          set -euo pipefail
          for banned in main.js preload.js node_modules tests governance package.json; do
            if [ -e "web-dist/$banned" ]; then echo "::error::banned path in web-dist: $banned"; exit 1; fi
          done
          if find web-dist -name '*.dmg' -o -name '*.asar' -o -name '*.zip' | grep -q .; then
            echo "::error::binary artifact found in web-dist"; exit 1
          fi
          test -f web-dist/index.html
          test -f web-dist/js/web-build-info.js
          echo "web-dist content audit ok ($(find web-dist -type f | wc -l) files)"

      - name: Web preview gate (adapter + bundle contract)
        run: node tests/web-preview-gate.test.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
